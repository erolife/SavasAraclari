<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Favori sergilerinizi, son incelenen araçları ve kaldığınız yeri görün.">
  <title>Koleksiyonum — Savaş Makineleri</title>
  <script src="js/museum-preferences.js"></script>
  <link rel="stylesheet" href="css/museum-explore.css">
  <link rel="stylesheet" href="css/museum-preferences.css">
  <link rel="stylesheet" href="css/museum-collection.css">
</head>
<body>
  <nav class="museum-nav collection-nav" aria-label="Müze gezinmesi">
    <a href="index.html#timeline" data-collection-text="back">← Envanter</a>
  </nav>
  <main class="explore personal-collection">
    <header>
      <h1 data-collection-text="title">Koleksiyonum</h1>
      <p data-collection-text="privacy">Favoriler ve inceleme geçmişi yalnızca bu tarayıcıda saklanır.</p>
      <p id="collection-storage" role="status" hidden></p>
    </header>
    <section class="collection-resume" aria-labelledby="resume-title">
      <div>
        <h2 id="resume-title" data-collection-text="resume">Kaldığın yerden devam et</h2>
        <p id="resume-detail"></p>
      </div>
      <a class="action primary" id="resume-exhibit" aria-describedby="resume-detail" hidden data-collection-text="open">Devam et ↗</a>
    </section>
    <div class="collection-columns">
      <section aria-labelledby="favorites-title">
        <div class="collection-heading"><h2 tabindex="-1" id="favorites-title" data-collection-text="favorites">Favoriler</h2></div>
        <p class="collection-empty" id="favorites-empty" data-collection-text="noFavorites">Bir sergideki ☆ Favori düğmesine dokunarak buraya ekleyebilirsin.</p>
        <ul class="collection-list" id="favorites-list"></ul>
      </section>
      <section aria-labelledby="recent-title">
        <div class="collection-heading">
          <h2 id="recent-title" tabindex="-1" data-collection-text="recent">Son incelenenler</h2>
          <button type="button" id="clear-history" data-collection-text="clear" hidden>Geçmişi temizle</button>
        </div>
        <p class="collection-empty" id="recent-empty" data-collection-text="noRecent">Açtığın sergiler burada görünür.</p>
        <ul class="collection-list" id="recent-list"></ul>
      </section>
    </div>
    <footer class="collection-controls">
      <button type="button" id="reset-collection" data-collection-text="reset" hidden>Koleksiyonu sıfırla</button>
      <p role="status" id="collection-status"></p>
    </footer>
    <noscript>Kişisel koleksiyon JavaScript gerektirir.</noscript>
  </main>
  <dialog class="collection-dialog" id="collection-confirm" aria-labelledby="collection-confirm-title">
    <form method="dialog">
      <h2 id="collection-confirm-title"></h2>
      <p id="collection-confirm-detail"></p>
      <div class="actions">
        <button value="cancel" autofocus data-collection-text="cancel">Vazgeç</button>
        <button value="confirm" data-collection-text="confirm">Temizle</button>
      </div>
    </form>
  </dialog>
  <script src="js/catalog.js"></script>
  <script src="js/catalog-source-en.js"></script>
  <script src="js/catalog-en.js"></script>
  <script src="js/museum-collection.js"></script>
  <script src="js/museum-collection-page.js"></script>
</body>
</html>
